<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Kodarase</title>
<link rel="icon" type="image/jpeg" href="logo-kodara.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060B18;--bg-2:#0A1424;--card:#0F1A2E;
  --border:rgba(255,255,255,0.08);--border-2:rgba(255,255,255,0.14);
  --text:#fff;--text-2:#B8C0D0;--text-3:#6B7689;
  --orange:#F97316;--pink:#EC4899;--green:#10B981;--red:#EF4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at top, rgba(124,58,237,0.18), transparent 60%),
             radial-gradient(ellipse at bottom right, rgba(249,115,22,0.14), transparent 60%),
             var(--bg);
}
a{color:var(--orange);text-decoration:none}
a:hover{text-decoration:underline}

.auth-box{
  background:var(--card);border:1px solid var(--border);
  border-radius:24px;padding:40px 36px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4)
}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;text-decoration:none}
.auth-logo img{width:42px;height:42px;border-radius:8px}
.auth-logo .name{font-weight:800;font-size:22px;color:#fff}
.auth-logo .sub{color:var(--orange);font-size:11px;font-weight:600;letter-spacing:1.5px}

.auth-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;margin-bottom:8px;letter-spacing:-1px}
.auth-sub{color:var(--text-2);font-size:14px;margin-bottom:28px}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase}
.field input{
  width:100%;background:var(--bg-2);border:1px solid var(--border);
  color:#fff;font-size:15px;font-family:inherit;
  padding:13px 16px;border-radius:12px;outline:none;transition:border-color 0.2s
}
.field input:focus{border-color:var(--orange)}

.btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:700;padding:14px 20px;border-radius:12px;border:none;
  cursor:pointer;transition:all 0.2s;font-family:inherit;
}
.btn-primary{background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;margin-top:8px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(249,115,22,0.35)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}

.btn-google{background:#fff;color:#1F1F1F;margin-top:12px}
.btn-google:hover{background:#F5F5F5}
.btn-google svg{width:18px;height:18px}

.divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--text-3);font-size:12px;font-weight:600;letter-spacing:1px}
.divider::before, .divider::after{content:'';flex:1;height:1px;background:var(--border)}

.alert{
  padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#FCA5A5;
  display:none;
}
.alert.show{display:block}
.alert.success{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:#6EE7B7}

.auth-footer{margin-top:24px;text-align:center;font-size:14px;color:var(--text-2)}
.auth-forgot{font-size:12px;color:var(--text-3);text-align:right;margin-top:-8px;margin-bottom:12px}
</style>
</head>
<body>

<div class="auth-box">
  <a href="index.html" class="auth-logo">
    <img src="logo-kodara.jpeg" alt="Kodarase">
    <div>
      <div class="name">Kodarase</div>
      <div class="sub">SE</div>
    </div>
  </a>

  <h1 class="auth-title">Bienvenido de vuelta</h1>
  <p class="auth-sub">Inicia sesión para acceder a tu cuenta, pedidos y descuentos exclusivos.</p>

  <div class="alert" id="alert"></div>

  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="tu@email.com">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="auth-forgot"><a href="#" id="forgot-link">¿Olvidaste tu contraseña?</a></div>
    <button type="submit" class="btn btn-primary" id="login-btn">Iniciar sesión</button>
  </form>

  <div class="divider">o continúa con</div>

  <button class="btn btn-google" id="google-btn">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continuar con Google
  </button>

  <div class="auth-footer">
    ¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a>
  </div>
</div>

<script type="module">
import { loginEmail, loginGoogle, resetPassword } from './auth.js';

const alert = document.getElementById('alert');
const form = document.getElementById('login-form');
const loginBtn = document.getElementById('login-btn');
const googleBtn = document.getElementById('google-btn');
const forgotLink = document.getElementById('forgot-link');
const emailIn = document.getElementById('email');
const passwordIn = document.getElementById('password');

function showError(msg) {
  alert.textContent = msg;
  alert.className = 'alert show';
}
function showSuccess(msg) {
  alert.textContent = msg;
  alert.className = 'alert success show';
}
function getNext() {
  return new URLSearchParams(location.search).get('next') || 'mi-cuenta.html';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginBtn.disabled = true;
  loginBtn.textContent = 'Iniciando...';
  try {
    await loginEmail(emailIn.value, passwordIn.value);
    location.href = getNext();
  } catch (err) {
    showError(translateError(err.code));
    loginBtn.disabled = false;
    loginBtn.textContent = 'Iniciar sesión';
  }
});

googleBtn.addEventListener('click', async () => {
  googleBtn.disabled = true;
  try {
    await loginGoogle();
    location.href = getNext();
  } catch (err) {
    showError(translateError(err.code));
    googleBtn.disabled = false;
  }
});

forgotLink.addEventListener('click', async (e) => {
  e.preventDefault();
  const email = emailIn.value.trim();
  if (!email) { showError('Escribe tu email primero'); return; }
  try {
    await resetPassword(email);
    showSuccess('Te enviamos un email para restablecer tu contraseña');
  } catch (err) {
    showError(translateError(err.code));
  }
});

function translateError(code) {
  const map = {
    'auth/invalid-credential': 'Email o contraseña incorrectos',
    'auth/wrong-password': 'Contraseña incorrecta',
    'auth/user-not-found': 'No existe cuenta con ese email',
    'auth/invalid-email': 'Email inválido',
    'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde',
    'auth/network-request-failed': 'Sin conexión a internet',
    'auth/popup-closed-by-user': 'Cerraste la ventana de Google',
  };
  return map[code] || 'Error: ' + code;
}
</script>

</body>
</html>
